# Template: PR-pipeline_full.yml (entry workflow)
# Replace <placeholders> with values extracted from the CodeArts pipeline
name: PR-pipeline_full

on:
  pull_request_target:
    branches:
      # List target branches from the CodeArts pipeline's trigger config
      # Common: master, main, release branches
      - master
    types:
      - open
      - update
      - reopen
      - merge
    branches-ignore: []
    paths-ignore: []
    code-update: false
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]
  workflow_dispatch:
    inputs:
      print_tags:
        description: 'True to print to STDOUT'
        required: true
        type: boolean
      tags:
        description: 'Test scenario tags'
        required: true
        type: boolean

# IMPORTANT: Use env: NOT inputs: for atomgit context variables in entry workflow!
# inputs with atomgit defaults fail on PR triggers with "Input required and not supplied"
env:
  BUILD_SKIP: "no"
  # System context (atomgit.event.*) - use env so they work on PR triggers
  REPO_NAME: ${{ atomgit.event.repository.name }}
  REPO_OWNER: "<owner>"
  REMOTE_URL: ${{ atomgit.repositoryurl }}
  PR_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref }}
  # Define SWR image references here (extracted from CodeArts job configs)
  # img_clone_x86: "swr.<region>.myhuaweicloud.com/<org>/<image>:<tag>"
  # img_sca_x86: "swr.<region>.myhuaweicloud.com/<org>/<image>:<tag>"
  # img_build_x86: "swr.<region>.myhuaweicloud.com/<org>/<image>:<tag>"
  # img_build_arm: "swr.<region>.myhuaweicloud.com/<org>/<image>:<tag>"
  # img_ut_python_x86: "swr.<region>.myhuaweicloud.com/<org>/<image>:<tag>"

stages:
  # Stage naming convention: name is a &-joined list of task categories in the stage.
  # Categories: CodeCheck (static checks), Build (compilation), Test (UT/smoke).
  # Examples: CodeCheck, CodeCheck&Build&Test, Build&Test, Build
  stage_0:
    name: CodeCheck
    select: selected_by_default
    jobs:
      Only_doc_commit_check:
        name: Only_doc_commit_check
        runs-on: [ dedicate-hosted, x64, large ]
        container:
          image: swr.<region>.myhuaweicloud.com/<org>/<check_image>
          options: --user root
        outputs:
          build_skip: ${{ steps.set-skip.outputs.build_skip }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha || '' }}
          - name: only doc commit check
            id: only-doc-check
            uses: <owner>/<repo>/.gitcode/actions/only_doc_commit_check@<branch>
            with:
              pr_id: ${{ inputs.pr_id }}
              target_branch: ${{ atomgit.event.pull_request.base.ref }}
              remote_url: ${{ env.ATOMGIT_REPOSITORY_URL }}
          - name: set build skip flag
            id: set-skip
            run: |
              BUILD_SKIP=${{ steps.only-doc-check.outputs.is_only_doc }}
              echo "build_skip=${BUILD_SKIP}" >> "$ATOMGIT_OUTPUT"
              echo "Only Doc Commit Check result: ${BUILD_SKIP}"

  # Static checks, builds, and tests go in stage_1
  # Name is &-joined based on what categories are present.
  # If this stage contains CodeCheck + Build + Test → name: CodeCheck&Build&Test
  # If only Build + Test → name: Build&Test
